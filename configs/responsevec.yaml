# ResponseVec configuration — single source of truth.
# Data section matches the RAPL/SocioBench pipeline (same leakage-safe splits);
# the representation/decoder/protocol sections are new (design docs §2, §5, §6).

seed: 1701

paths:
  sociobench_repo: external/SocioBench
  processed: artifacts/processed
  cache: artifacts/cache                    # hash-validated representation caches (per family/K)
  heads: artifacts/heads                    # trained option-aware decoders (3 seeds each)
  predictions: artifacts/predictions
  metrics: artifacts/metrics
  figures: artifacts/figures

data:
  # Public SocioBench release (A_GroundTruth_sampling500): 500 respondents per
  # domain across ~30 countries. Four domains x 500 = ~2000 respondents.
  domains: [Environment, Role of Government, Social Inequality, Work Orientations]
  countries_per_domain: 99                   # effectively "keep all countries"
  max_respondents_per_country: 3000          # non-binding at this scale
  min_answered_items_per_respondent: 10
  max_items_per_domain: 20
  unseen_item_fraction: 0.0                  # Protocol B owns item holdout; do not create a second legacy holdout
  intersection_attributes: [sex, age_bin, education]
  intersection_holdout_fraction: 0.15
  min_cell_size: 12
  respondent_split: [0.70, 0.10, 0.20]
  k_values: [0, 1, 3, 5, 8]
  calibration_seed: 1701
  calibration_seeds_secondary: [7, 42]

# Protocol B unseen-item folds (design §5.2): a fixed calibration-source pool
# (can appear in history, never a target) plus six deterministic target folds
# so every candidate target is a test-unseen item exactly once.
item_folds:
  calibration_pool_fraction: 0.40            # ~40% of items, capped
  calibration_pool_cap: 8
  n_folds: 6                                 # each outer fold: 4/6 train, 1/6 val, 1/6 test; every item is test once

# History selection (design §2.1): semantic top-K via a frozen retriever, with
# random-K and all-history controls. Never uses target labels/statistics.
history:
  retriever: BAAI/bge-base-en-v1.5           # frozen, encodes question text only
  selection: semantic                        # semantic | random | all
  max_history_items: 8

prior:
  country_shrinkage: 20.0
  laplace: 0.5

# Representation extraction (design §2.3, §6.1). Backbones frozen; one forward
# pass yields direct logits AND raw causal hidden states. LLM2Vec / LLM2Vec-Gen
# are separate encoder passes over the same prompt.
representation:
  backbone: Qwen/Qwen3-8B                                       # direct + raw hidden state
  input_centric_base: McGill-NLP/LLM2Vec-Qwen3-8B-mntp          # bidirectional base
  input_centric: McGill-NLP/LLM2Vec-Qwen3-8B-mntp-supervised    # PEFT adapter + frozen option encoder E_o
  response_centric: McGill-NLP/LLM2Vec-Gen-Qwen3-8B             # primary ResponseVec encoder
  small_backbone: Qwen/Qwen3-0.6B                               # scale analysis + T4 fallback
  small_input_centric_base: McGill-NLP/LLM2Vec-Qwen3-06B-mntp
  small_input_centric: McGill-NLP/LLM2Vec-Qwen3-06B-mntp-supervised
  small_response_centric: McGill-NLP/LLM2Vec-Gen-Qwen3-06B
  smoke_backbone: hf-internal-testing/tiny-random-LlamaForCausalLM
  option_encoder: McGill-NLP/LLM2Vec-Qwen3-8B-mntp-supervised   # E_o, frozen, shared across all methods
  sentence_encoder: BAAI/bge-base-en-v1.5                       # baseline text embedder
  dtype: bfloat16
  quantization: nf4                          # ignored on CPU/smoke and >=30GB GPUs
  max_length: 512
  batch_size: 32
  pooling: [final, mean]                     # both extracted for raw-causal; E2 ablation compares
  # Frozen on 2026-07-20. These commits are part of cache identity and the
  # model preflight verifies that every revision remains downloadable.
  revisions:
    backbone: b968826d9c46dd6066d109eabc6255188de91218
    input_centric_base: c84774c1366ea79f033504994bd254155d956d57
    input_centric: 4e2aabc835ace6256b43e9f08d1f580611ba4bd2
    response_centric: 08214b0dd083b63776c243390db9e40ae7078f36
    small_backbone: c1899de289a04d12100db370d81485cdf75e47ca
    small_input_centric_base: 36fa4cf0478f9d1c439397ae5690fb8705ac3725
    small_input_centric: 153ecc27c9359c0b4042506cabc2a9f451c3bc50
    small_response_centric: ffa5224a05d7ae373f326b1c49f0055680fbf7a6
    sentence_encoder: a5beb1e3e68b9ab74eb54cfd186867f64f240e1a

# Option-aware bilinear decoder (design §2.4) + objectives (§2.6).
decoder:
  projection_dim: 256
  dropout: 0.10
  head: bilinear                             # bilinear (primary) | mlp (secondary)
  epochs: 100
  early_stopping_patience: 10
  gradient_clip: 1.0
  batch_size: 256
  seeds: [1701, 7, 42]
  primary:
    lr: 1.0e-3
    weight_decay: 1.0e-5
    rps_lambda: 0.1
    prior_eta: 0.5                           # validation-selected once, then fixed across representation families
    temperature_init: 0.1
  # Restricted validation search (design §6.3): one global setting picked on
  # validation, reused across final folds.
  search:
    lr: [3.0e-4, 1.0e-3, 3.0e-3]
    weight_decay: [0.0, 1.0e-5, 1.0e-4]
    rps_lambda: [0.0, 0.1, 0.25, 0.5]        # ordinal RPS auxiliary coefficient
    prior_eta: [0.0, 0.25, 0.5, 0.75, 1.0]   # train-only prior blend weight (shared fairly across methods)
    temperature_init: [0.05, 0.1, 0.2]
  group_calibration_lambda: 0.0              # secondary; enabled only AFTER the representation-only comparison

finetune:
  # QLoRA upper-bound control (design §6.4 baseline 20): rank-16 adapter on the
  # same train targets with randomized option labels.
  lora_rank: 16
  lora_alpha: 32
  max_steps: 1200
  micro_batch: 4
  gradient_accumulation: 16
  lr: 2.0e-4

evaluation:
  bootstrap_resamples: 2000
  holm_alpha: 0.05
  practical_effect_nats: 0.02                # min practical effect for a primary claim (design §9.2)
  reference_k: 5                             # primary endpoint: unseen-item K=5
  permutation:
    n_permutations: 3                        # main results average 3 option orders (design §2.2)
    respondent_sample: 500
  # E0/G0 signal-audit gates (design §7 E0, §12 G0).
  signal_audit:
    seen_budget_min_nats: 0.02               # item-conditional K5 must beat K0 by this
    unseen_open_field_min_nats: 0.05         # scale-position fallback must be this much worse than unseen oracle marginal
